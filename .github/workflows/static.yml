name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate the website before publishing
        run: |
          python -m unittest discover -s tests
          python scripts/validate_site.py
          node --check js/script.js
          node --check js/role-page.js

      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html home.html favicon.ico sitemap.xml .nojekyll _site/
          cp -R AI ML DS DA DE css images js sounds _site/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
